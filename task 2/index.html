<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedBook - Doctor Appointments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  
    <header>
        <nav class="navbar">
            <div class="logo">MedBook</div>
            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#appointments" id="viewHistoryBtn">My Appointments</a>
            </div>
        </nav>
    </header>

   
    <main class="container">
        
        <section class="search-section" id="home">
            <h1>Find and Book a Doctor</h1>
            <div class="filters">
                <input type="text" id="searchInput" placeholder="Search doctor by name...">
                <select id="deptFilter">
                    <option value="All">All Departments</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Neurology">Neurology</option>
                    <option value="Pediatrics">Pediatrics</option>
                    <option value="Orthopedics">Orthopedics</option>
                </select>
            </div>
        </section>

     
        <section class="doctor-listings" id="doctorContainer">
          
        </section>
    </main>

    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeBooking">&times;</span>
            <h2>Book Appointment</h2>
            <h3 id="selectedDoctorName" class="doctor-highlight"></h3>
            
            <form id="bookingForm">
                <input type="hidden" id="doctorId">
                
                <div class="form-group">
                    <label for="patientName">Patient Name</label>
                    <input type="text" id="patientName" required>
                </div>
                
                <div class="form-group">
                    <label for="appointmentDate">Select Date</label>
                    <input type="date" id="appointmentDate" required>
                </div>
                
                <div class="form-group">
                    <label for="timeSlot">Select Time Slot</label>
                    <select id="timeSlot" required>
                      
                    </select>
                </div>
                
                <button type="submit" class="btn-primary w-100">Confirm Booking</button>
            </form>
        </div>
    </div>

    <div id="summaryModal" class="modal">
        <div class="modal-content text-center">
            <span class="close-btn" id="closeSummary">&times;</span>
            <div class="success-icon">✔</div>
            <h2>Booking Confirmed!</h2>
            <div id="summaryDetails" class="summary-details">
               
            </div>
            <button class="btn-primary" id="btnDone">Done</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
